[project]
name = "llm-fast-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Aditya Karnam",email = "akarnam37@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "llama-cpp-python (>=0.3.5,<0.4.0)",
    "langchain-community (>=0.3.23,<0.4.0)",
    "langchain (>=0.3.24,<0.4.0)",
    "openai (>=1.76.0,<2.0.0)",
    "langchain-openai (>=0.3.14,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "llama-cpp-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal"
priority = "supplemental"


[tool.poetry.dependencies]
llama-cpp-python = {source = "llama-cpp-metal"}
